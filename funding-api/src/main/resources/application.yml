# funding-automation. Every endpoint comes from an environment variable (plan "Local Environment").
spring:
  application.name: funding-automation
  profiles.default: local
  # Rule + activity config defaults, shared with the seed generator (constitution P-2.1).
  config.import: classpath:funding-rules.properties
  datasource:
    url: ${FUNDING_DB_URL:jdbc:postgresql://127.0.0.1:55432/funding}
    username: ${FUNDING_DB_USER:funding}
    password: ${FUNDING_DB_PASSWORD:funding}
  flyway.locations: classpath:db/migration
  mvc.problemdetails.enabled: true
  # Spec 002 FR-09/FR-11: bearer tokens from this OIDC issuer, for this audience. Required outside
  # local (no default), so a missing issuer fails at startup.
  security.oauth2.resourceserver.jwt:
    issuer-uri: ${OIDC_ISSUER_URI}
    audiences: funding-api
server:
  port: ${SERVER_PORT:8080}

funding:
  env: ${FUNDING_ENV:local}
  temporal:
    target: ${TEMPORAL_ADDRESS:localhost:7233}
    namespace: ${TEMPORAL_NAMESPACE:default}
  aws:
    endpoint: ${AWS_ENDPOINT_URL:}
    region: ${AWS_REGION:us-west-2}
    ca-bundle: ${AWS_CA_BUNDLE:}
  trigger:
    api-key: ${FUNDING_TRIGGER_API_KEY:}
    api-base-url: ${FUNDING_API_BASE_URL:http://localhost:${server.port}}
    http-timeout: PT5S
    local-runner:
      enabled: false
      wait-seconds: 10
    queue:
      visibility-timeout-seconds: 60
      max-receive-count: 5
  relay:
    interval-ms: 1000
    batch-size: 50
  disbursement.base-url: ${FUNDING_DISBURSEMENT_BASE_URL:http://127.0.0.1:8089}
  income.base-url: ${FUNDING_INCOME_BASE_URL:http://127.0.0.1:8089}
  bootstrap-infra: false
  seed-data: false
  # T603: also seed one application per mock catalog entry (LA-5xxx income, LA-6xxx disbursement).
  # Takes effect only where seeding runs (the local profile, behind funding.seed-data).
  seed.volume: ${FUNDING_SEED_VOLUME:false}
  mocks.load: false
  # Spec 002 D-13: user id (the token's sub) → role, as funding.auth.users. None outside local
  # until single sign-on, so every funder API call there is refused (403 UNKNOWN_USER).

---
spring.config.activate.on-profile: local
spring.flyway.locations: classpath:db/migration,classpath:db/local
# The mock provider from scripts/oidc-env.sh (127.0.0.1, so the token's iss matches).
spring.security.oauth2.resourceserver.jwt.issuer-uri: ${OIDC_ISSUER_URI:http://127.0.0.1:8090/funding}
# T607: Spring and Temporal SDK metrics at /actuator/metrics, locally only (aws keeps health only).
management.endpoints.web.exposure.include: health,info,metrics
funding:
  bootstrap-infra: true
  seed-data: true
  mocks.load: true
  trigger:
    api-key: ${FUNDING_TRIGGER_API_KEY:local-dev-key}
    local-runner.enabled: true
  # Sign in as one of these on the mock provider's login page, or get a token with
  # client_credentials and client_id=<user id> (plan §4). One specialist per kind of work, a
  # catch-all for work no specialist owns, and a supervisor (spec 002 D-15, D-17, AS-11.7).
  auth.users:
    gap-1: GAP_SPECIALIST
    income-1: INCOME_SPECIALIST
    risc-1: RISC_SPECIALIST
    docs-1: DOCUMENTS_SPECIALIST
    payment-1: PAYMENT_SPECIALIST
    general-1: GENERAL_FUNDER
    supervisor-1: SUPERVISOR

---
spring.config.activate.on-profile: aws
funding:
  bootstrap-infra: false
  seed-data: false
  mocks.load: false
  trigger.local-runner.enabled: false
