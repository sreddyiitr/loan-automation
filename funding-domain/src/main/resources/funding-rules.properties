# Rule configuration defaults (FR-12). Single source for the app (Spring imports this file) and for
# the seed generator (constitution P-2.1). Override per environment with the usual Spring
# mechanisms (env vars, profile yaml); SeedRegenerateMain accepts -D overrides.
# Changing a value here changes the rule fingerprint: run `make seed-regenerate`.
funding.tila.sum-tolerance=0.00
funding.tila.payment-tolerance=0.01
# Primary lender (AS-6.2). Read by the GAP lender rule (S2) and by the seed generator for creditor names.
funding.gap.primary-lender-name=Summit Auto Finance
# Activity budgets (NFR-03, NFR-01). The workflows use them, and the mock generator derives fault
# delays and retry counts from them (P-5.2), so a changed budget moves the generated stubs with it.
funding.activity.retry.initial-interval=PT1S
funding.activity.retry.backoff-coefficient=2.0
funding.activity.retry.maximum-interval=PT1M
funding.activity.retry.max-attempts=5
funding.activity.start-to-close.db=PT10S
funding.activity.start-to-close.external=PT15S
# Mock catalog breadth (P-5.6)
funding.mocks.min-per-band=5
