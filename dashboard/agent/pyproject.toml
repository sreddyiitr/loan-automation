[project]
name = "funder-agent"
version = "0.1.0"
description = "The funder dashboard agent (spec 002): A2UI surfaces built by code, writes through the funder API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[http-server]>=0.3.26",
    "a2ui-a2a>=0.4.0",
    "a2ui-agent-sdk>=0.12.0",
    "httpx>=0.28.1",
    "pyyaml>=6.0.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
