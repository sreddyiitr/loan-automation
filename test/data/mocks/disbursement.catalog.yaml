# Disbursement mock data catalog (constitution P-5, seed-data.md "Disbursement").
# Intent only: response bodies, delays and retry counts are generated by MockStubGenerator from
# the live funding.* config (retry.max-attempts, start-to-close.external). Never type a value here
# that the config determines.
api: DISBURSEMENT
contract: disbursement.openapi.yaml
magnitudes: ["9850.00", "24000.00", "28450.00", "31875.50", "89999.99", "150000.00"]
classes:
  SUCCESS:               { expect: FUNDED }
  IDEMPOTENT_REPLAY:     { expect: FUNDED }     # 2nd call with the same key -> 200, same reference
  TIMEOUT_BUT_PROCESSED: { expect: FUNDED }     # 1st call delayed past start-to-close; retry -> 200 same reference
  RETRY_THEN_OK:         { expect: FUNDED, k: retryBudget }   # 503 x k then 201, k = 1 .. maxAttempts-1
  EXHAUSTED:             { expect: APPROVED }   # 503 x maxAttempts (C-8)
  KEY_CONFLICT:          { expect: APPROVED }   # 409, not retried
  DEALER_INVALID:        { expect: APPROVED }   # 422 DEALER_ACCOUNT_INVALID, not retried
  MALFORMED:             { expect: APPROVED, violatesContract: true }   # 201 with invalid JSON
