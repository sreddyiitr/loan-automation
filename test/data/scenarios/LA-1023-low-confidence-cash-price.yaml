id: LA-1023
title: Low-confidence cash price
rules: [CONFIDENCE_FLAG]
side: NEEDS_REVIEW
spec: AS-7.1
summary: "RISC `cash_price` confidence {risc.cash_price.confidence} (one step below the cut-off)"
given:
  risc:
    confidence: { cash_price: belowFlag }
expect:
  checks: { PRICE: NEEDS_REVIEW }
  status: STIPULATED
  stips: [STIP_EXTRACTION_REVIEW_REQUIRED]
# S5: the RISC stip can't be waived (AS-8.10); a re-scanned RISC v2 at the normal confidence fixes it.
amend:
  documents: [risc]
  expect:
    checks: { TILA: PASS, PRICE: PASS, VIN: PASS, INCOME: PASS, GAP: PASS }
    status: FUNDED
    stips: []
